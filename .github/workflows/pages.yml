name: Demo · GitHub Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'dist/**', 'scripts/build-site.mjs', 'scripts/serve-site.mjs', 'tests/site.spec.mjs', 'playwright.site.config.mjs', '.github/workflows/pages.yml', 'package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public demo
        id: deployment
        uses: actions/deploy-pages@v4
